
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Let's Cut the Cake 🎂</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --cream: #fff9e9;
      --peach: #ffe5b8;
      --orange: #ffb347;
      --pink: #ff8e9e;
      --brown: #70452e;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(
        circle at top,
        #fff9e9 0%,
        #ffefc7 55%,
        #ffde9f 100%
      );
      color: var(--brown);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }

    .sparkle {
      position: fixed;
      pointer-events: none;
      font-size: 17px;
      opacity: 0.65;
      animation: float 4s ease-in-out infinite;
    }

    .s1 { top: 9%; left: 10%; }
    .s2 { top: 19%; right: 11%; animation-delay: 1s; }
    .s3 { bottom: 17%; left: 12%; animation-delay: 1.5s; }
    .s4 { bottom: 12%; right: 10%; animation-delay: 0.5s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0); }
      50% { transform: translateY(-13px) rotate(12deg); }
    }

    .page {
      width: 100%;
      max-width: 390px;
      text-align: center;
      animation: appear 0.8s ease both;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .top-label {
      display: inline-block;
      padding: 9px 15px;
      background: rgba(255,255,255,0.65);
      border: 1px solid rgba(255,179,71,0.4);
      border-radius: 100px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #bd7742;
      margin-bottom: 23px;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(36px, 10vw, 45px);
      font-weight: 400;
      line-height: 1.12;
      margin-bottom: 12px;
      color: #75482f;
    }

    h1 span {
      color: #f07882;
      font-style: italic;
    }

    .subtitle {
      font-size: 13px;
      line-height: 1.8;
      color: #96745a;
      max-width: 290px;
      margin: 0 auto;
    }

    .cake-stage {
      margin: 27px auto 23px;
      position: relative;
      width: 100%;
      min-height: 245px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 28px;
      background: rgba(255,255,255,0.42);
      border: 1px solid rgba(255,255,255,0.85);
      box-shadow: 0 14px 35px rgba(177,119,55,0.09);
      overflow: hidden;
    }

    .cake-glow {
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: rgba(255,183,119,0.28);
      filter: blur(24px);
    }

    .cake {
      position: relative;
      z-index: 1;
      font-size: 130px;
      line-height: 1;
      filter: drop-shadow(0 12px 10px rgba(135,82,35,0.15));
      transform-origin: center bottom;
      transition: transform 0.3s ease;
      user-select: none;
    }

    .cake.cut {
      animation: cakeCut 0.65s ease;
    }

    @keyframes cakeCut {
      0% { transform: scale(1) rotate(0); }
      30% { transform: scale(1.08) rotate(-5deg); }
      60% { transform: scale(0.95) rotate(4deg); }
      100% { transform: scale(1) rotate(0); }
    }

    .cake-hint {
      position: absolute;
      bottom: 17px;
      left: 0;
      right: 0;
      z-index: 2;
      font-size: 11px;
      color: #b58b67;
      letter-spacing: 0.5px;
    }

    .cut-button {
      width: 100%;
      min-height: 56px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(135deg, #ff8e9e, #ffb347);
      color: white;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 9px 20px rgba(241,131,117,0.25);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .cut-button:active {
      transform: scale(0.97);
    }

    .wish {
      min-height: 45px;
      margin-top: 18px;
      font-size: 13px;
      line-height: 1.7;
      color: #a36e4d;
      opacity: 0;
      transform: translateY(8px);
      transition: 0.4s ease;
    }

    .wish.show {
      opacity: 1;
      transform: translateY(0);
    }

    .next-button {
      width: 100%;
      min-height: 54px;
      margin-top: 10px;
      border: 1.5px solid rgba(190,127,72,0.35);
      border-radius: 18px;
      background: rgba(255,255,255,0.55);
      color: #855334;
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: 0.4s ease;
    }

    .next-button.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .confetti {
      position: fixed;
      top: -20px;
      width: 8px;
      height: 12px;
      border-radius: 3px;
      pointer-events: none;
      z-index: 5;
      animation: fall 2.4s ease-in forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110svh) rotate(720deg);
        opacity: 0;
      }
    }

    .footer {
      margin-top: 20px;
      font-size: 10px;
      color: #b58d68;
      letter-spacing: 1px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="sparkle s1">✦</div>
  <div class="sparkle s2">♡</div>
  <div class="sparkle s3">✧</div>
  <div class="sparkle s4">♡</div>

  <main class="page">
    <div class="top-label">♡ THE BIRTHDAY CONTINUES ♡</div>

    <h1>Okayyy, let's<br><span>cut the cake!</span> 🎂</h1>

    <p class="subtitle">
      One little cake, a million sweet wishes,<br>
      and a whole lot of love for you.
    </p>

    <section class="cake-stage" aria-label="Birthday cake">
      <div class="cake-glow"></div>
      <div class="cake" id="cake" aria-label="Birthday cake">🎂</div>
      <div class="cake-hint" id="cakeHint">made with extra birthday magic ✨</div>
    </section>

    <button class="cut-button" id="cutButton">
      🔪 Tap here to cut the cake!
    </button>

    <p class="wish" id="wish" aria-live="polite">
      YAYYY, CAKE CUTTING TIME!! 🥹💗<br>
      May your day be filled with love, laughter &amp; happiness.
    </p>

    <button class="next-button" id="nextButton">
      One more surprise awaits... 🎁 →
    </button>

    <div class="footer">MADE WITH ♡ AND A LITTLE MAGIC</div>
  </main>

  <script>
    const cake = document.getElementById('cake');
    const cutButton = document.getElementById('cutButton');
    const cakeHint = document.getElementById('cakeHint');
    const wish = document.getElementById('wish');
    const nextButton = document.getElementById('nextButton');

    let cakeHasBeenCut = false;

    function makeConfetti() {
      const colors = ['#FFB347', '#FF6B6B', '#FFD93D', '#FF8E9E', '#FFFFFF'];

      for (let i = 0; i < 55; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti';
        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.backgroundColor =
          colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDelay = Math.random() * 0.8 + 's';
        piece.style.animationDuration = (1.7 + Math.random() * 1.5) + 's';
        piece.style.width = (5 + Math.random() * 6) + 'px';
        piece.style.height = (7 + Math.random() * 8) + 'px';

        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 4000);
      }
    }

    cutButton.addEventListener('click', () => {
      if (cakeHasBeenCut) return;

      cakeHasBeenCut = true;

      cake.classList.remove('cut');
      void cake.offsetWidth;
      cake.classList.add('cut');

      cakeHint.textContent = 'a little slice of birthday happiness ♡';
      cutButton.textContent = '💗 Cake successfully cut!!';
      cutButton.style.background = 'linear-gradient(135deg, #ffad91, #f28a9a)';

      wish.classList.add('show');
      nextButton.classList.add('show');

      makeConfetti();

      if (navigator.vibrate) {
        navigator.vibrate(80);
      }
    });

    nextButton.addEventListener('click', () => {
      window.location.href = 'gift.html';
    });
  </script>
</body>
</html>
