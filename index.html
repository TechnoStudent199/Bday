
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1,
        user-scalable=no, viewport-fit=cover">

  <meta name="theme-color" content="#080808">
  <title>thankkuuuu 😭💋</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      background: #080808;
      color: #fff8f1;
      font-family: "Outfit", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .screen {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      height: 100dvh;
      margin: 0 auto;
      padding:
        max(24px, env(safe-area-inset-top))
        22px
        max(24px, env(safe-area-inset-bottom));

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 25px;
      overflow: hidden;
      isolation: isolate;
    }

    /* Soft ambient background glow */
    .ambient {
      position: absolute;
      z-index: -1;
      width: 310px;
      height: 310px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -65%);
      border-radius: 50%;
      background: #e8a9bb;
      opacity: .09;
      filter: blur(90px);
      animation: ambientPulse 4s ease-in-out infinite;
    }

    .tag {
      padding: 9px 16px;
      border: 1px solid #ffffff20;
      border-radius: 999px;
      background: #ffffff08;
      color: #ead7c6;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: fadeIn .8s ease .1s both;
    }

    /* Video card */
    .video-card {
      position: relative;
      width: min(82vw, 330px);
      aspect-ratio: 9 / 12;
      max-height: 49dvh;
      overflow: hidden;
      border: 5px solid #fffaf3;
      border-radius: 29px;
      background: #171311;

      box-shadow:
        0 20px 60px #0009,
        0 0 35px #ffc9a30b;

      opacity: 0;
      transform: scale(.84) translateY(16px);

      animation:
        popIn .9s cubic-bezier(.16, 1, .3, 1) .15s forwards;

      transition: opacity .65s, transform .65s;
    }

    .video-card video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #171311;
    }

    .video-label {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);

      max-width: calc(100% - 18px);
      padding: 8px 13px;

      border: 1px solid #ffffff55;
      border-radius: 999px;
      background: #fffdf0d9;

      color: #583820;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* Thank-you message */
    .message {
      width: 100%;
      margin: 0;
      text-align: center;

      font-family: "Poppins", sans-serif;
      font-size: clamp(28px, 8vw, 37px);
      font-weight: 800;
      line-height: 1.35;
      letter-spacing: -1px;

      opacity: 0;

      animation:
        messageIn .8s ease .65s forwards,
        bounce 1.5s ease-in-out 1.5s infinite;

      transition: opacity .5s, transform .5s;
    }

    .message .kiss {
      display: inline-block;
      filter: drop-shadow(0 0 12px #ff8baf66);
    }

    .caption {
      margin: -15px 0 0;
      color: #b8aaa0;
      font-size: 14px;
      text-align: center;
      opacity: 0;

      animation: fadeIn .7s ease 1s forwards;
      transition: opacity .4s;
    }

    /* Transition to the cake page */
    .transition-screen {
      position: absolute;
      inset: 0;
      z-index: 5;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 17px;
      padding: 30px;

      text-align: center;

      background:
        radial-gradient(ellipse at 50% 45%, #211815, #080808 72%);

      opacity: 0;
      visibility: hidden;
      transition: opacity .8s, visibility .8s;
    }

    .transition-screen.show {
      opacity: 1;
      visibility: visible;
    }

    .transition-emoji {
      font-size: 47px;
      animation: bounce 1.3s ease-in-out infinite;
    }

    .transition-screen h1 {
      max-width: 340px;
      margin: 0;

      font-family: "Poppins", sans-serif;
      font-size: clamp(27px, 7.5vw, 34px);
      font-weight: 700;
      line-height: 1.3;
    }

    .transition-screen p {
      margin: 0;
      color: #c7b4a4;
      font-size: 14px;
    }

    .loading-dots {
      margin-top: 8px;
      color: #ffd8b0;
      letter-spacing: 5px;
    }

    /* Animations */
    @keyframes popIn {
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(25px);
        filter: blur(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes bounce {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -6px; }
    }

    @keyframes ambientPulse {
      0%, 100% {
        scale: .9;
        opacity: .07;
      }
      50% {
        scale: 1.12;
        opacity: .14;
      }
    }

    .screen.leaving .video-card,
    .screen.leaving .message,
    .screen.leaving .caption,
    .screen.leaving .tag {
      opacity: 0;
      transform: translateY(-15px) scale(.96);
    }

    /* Short phone screens */
    @media (max-height: 650px) {
      .screen {
        gap: 15px;
      }

      .video-card {
        width: min(68vw, 245px);
        max-height: 41dvh;
        border-radius: 23px;
      }

      .message {
        font-size: 28px;
      }

      .caption {
        font-size: 12px;
        margin-top: -8px;
      }

      .tag {
        font-size: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ambient,
      .transition-emoji,
      .loading-dots {
        animation: none;
      }

      .video-card,
      .message,
      .caption,
      .tag {
        animation-duration: .01ms;
      }
    }
  </style>
</head>

<body>

  <main class="screen" id="screen">

    <div class="ambient"></div>

    <div class="tag">
      a little birthday moment ♡
    </div>

    <div class="video-card">

      <video
        id="catVideo"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
      >
        <source src="cat-kiss.mp4" type="video/mp4">
        Your browser does not support this video.
      </video>

      <div class="video-label">
        birthday video for u 🎂
      </div>

    </div>

    <h1 class="message">
      oh my god<br>
      thankkuuuu <span class="kiss">😭💋</span>
    </h1>

    <p class="caption">
      you actually remembered 🥹
    </p>

    <section
      class="transition-screen"
      id="transitionScreen"
      aria-live="polite"
    >
      <div class="transition-emoji">🎂✨</div>

      <h1>
        okay enough... let's cut cake together
      </h1>

      <p>
        your next little surprise is waiting ♡
      </p>

      <div class="loading-dots">•••</div>
    </section>

  </main>

  <script>
    const screen = document.getElementById("screen");
    const video = document.getElementById("catVideo");
    const transition = document.getElementById("transitionScreen");

    // CHANGE THESE TWO VALUES TO ADJUST THE TIMING.
    const VIDEO_DELAY = 2000;     // Wait 2 seconds before playing.
    const VIDEO_DURATION = 3500;  // Play for 3.5 seconds.

    // Start the video after the delay.
    setTimeout(() => {

      video.play().catch(() => {
        console.log(
          "Video playback was blocked or the video could not load."
        );
      });

      // Start the transition after the video has played.
      setTimeout(() => {

        screen.classList.add("leaving");
        transition.classList.add("show");

        // Open the separate cake page.
        setTimeout(() => {
          window.location.href = "cake.html";
        }, 2400);

      }, VIDEO_DURATION);

    }, VIDEO_DELAY);
  </script>

</body>
</html>
