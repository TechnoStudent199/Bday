<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>A birthday surprise 💌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: #080808;
      color: #fff8f1;
      font-family: "Outfit", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    button, input { font: inherit; }
    button { cursor: pointer; touch-action: manipulation; }
    .name-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 17px;
      padding: 30px;
      text-align: center;
      background: radial-gradient(ellipse at 50% 45%, #211815, #080808 72%);
    }
    .name-screen h1 {
      max-width: 360px;
      margin: 0;
      font: 700 clamp(27px, 7.5vw, 36px)/1.3 "Poppins", sans-serif;
    }
    .name-screen p { margin: 0; color: #c7b4a4; font-size: 14px; line-height: 1.7; }
    .name-emoji { font-size: 47px; animation: bounce 1.3s ease-in-out infinite; }
    .name-form { display: flex; flex-direction: column; gap: 12px; width: min(100%, 330px); margin-top: 8px; }
    .name-form input {
      width: 100%; min-height: 52px; padding: 13px 17px;
      border: 1px solid #ffffff35; border-radius: 16px;
      outline: none; background: #ffffff12; color: #fff8f1;
      text-align: center; font-size: 16px;
    }
    .name-form input::placeholder { color: #b8aaa0; }
    .name-form input:focus { border-color: #ffd8b0; box-shadow: 0 0 0 3px #ffd8b022; }
    .name-form button {
      min-height: 52px; border: 0; border-radius: 999px;
      background: linear-gradient(115deg, #f3d9aa, #e9bda8 55%, #f4e6c8);
      color: #654632; font-weight: 700;
    }
    .name-form button:active { transform: scale(.98); }
    @keyframes bounce { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }
    @media (prefers-reduced-motion: reduce) { .name-emoji { animation: none; } }
  </style>
</head>
<body>
  <main class="name-screen" aria-labelledby="nameHeading">
    <div class="name-emoji" aria-hidden="true">💌</div>
    <h1 id="nameHeading">Before the surprise…</h1>
    <p>What should I call you? ♡</p>
    <form class="name-form" id="nameForm">
      <input id="guestNameInput" name="name" type="text" maxlength="40" autocomplete="given-name" placeholder="Your name" aria-label="Your name" required>
      <button type="submit">LET'S CELEBRATE ♡</button>
    </form>
  </main>

  <script>
    const nameForm = document.getElementById('nameForm');
    const nameInput = document.getElementById('guestNameInput');

    nameForm.addEventListener('submit', event => {
      event.preventDefault();
      const guestName = nameInput.value.trim();
      if (!guestName) {
        nameInput.focus();
        return;
      }

      try {
        sessionStorage.setItem('birthdayGuestName', guestName);
      } catch (error) {
        // The cake page uses a default greeting if session storage is unavailable.
      }

      window.location.href = 'video.html';
    });
  </script>
</body>
</html>
